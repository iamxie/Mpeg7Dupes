# Defaults for find_reuse.py.
#
# Precedence: command line > this file > the built-in defaults. Put the values
# you do not want to type every time here and leave the rest out. Point at a
# different file with --config.

# Sampling rate. The source and the candidates must use the same value; mixing
# them puts every comparison out of step.
#
# 5 is the measured balance. A 70 second clip gives 351 fingerprints at this
# rate, enough for the match to stand up, and going higher only slows the
# decode without improving detection. Changing it invalidates every cached
# signature, which the script notices and recomputes.
fps = 5.0

# How much of the source a candidate must contain before it is reported, in
# percent.
#
# 40 has measurements behind it. Across 96 videos, the 60 that did not contain
# the source reached 8% at most, and the 36 that did all reached 100%. 40 sits
# in the empty space between, far from either.
#
# A later sweep over all 4560 pairs those 96 videos form, at -x 290 -m longest,
# put a window around it. Two things bound the value from opposite sides:
#
#   37.1%  the most a pair that merely shares a 70 second advertisement reached
#   48.0%  where 31 genuine duplicates sit, being the 120 second overlap between
#          the middle-60% windows of a 5 and a 10 minute cut of one source,
#          600 frames of the 1250 in the shorter file
#
# So the usable window is (37.1, 48.0], about eleven points wide, and 40 sits
# near its lower end. Raising it to 50 drops recall from 99.6% to 92.6% by cutting
# into that cluster. Lowering it to 30 admits 25 advertisement-only pairs.
# That sweep divides by the shorter video (same-video question). This wrapper
# divides by the source's own frame count; the two 40% rules are not equivalent.
#
# At 40 the result over those 4560 pairs is 717 of 720 true duplicates found
# with no false positives, bars left on; 720 of 720 with them cropped. Those
# pairs are the corpus the settings were tuned on, six sources and eight
# treatments: read the figures as a fit to that material, not a forecast for
# yours.
#
# Two independent sets were measured since. On both, 40 held for five minute
# sources and the 60 s advertisement. On the second set and a length test on
# its sources, sources under about two minutes whose picture has a common
# light layout, night timelapses and a basketball video game, were reported
# inside unrelated videos of a similar layout: in 5 to 10% of unrelated
# candidates from 10 to 60 s, 1.5% at 90 s, none at 120 s. Two unrelated
# videos can share a stretch of about 40 s of frames that only look alike, and
# that is 40% of a 100 s source. Look at such a match before acting on it.
# See benchmark.md, Second independent validation.
#
# Coverage runs a little high: clips using 86%, 50% and 30% of the source came
# back as 88%, 54% and 33%, because the walk that extends a match carries a few
# frames past each end of what is really shared. So 40 fires at around 36% of
# real use. Erring that way is deliberate. Better to look at a few extra videos
# than to miss one.
min_coverage = 40.0

# Look for bars along the top and bottom of each video and crop them off
# before fingerprinting.
#
# Bars do two things to a comparison, and both are worth undoing. They are the
# same black in every video that carries them, about a fifth of the frame, so
# two unrelated videos with bars agree on a fifth of every frame before the
# picture is looked at. And a bar shifts the picture inside the frame, so one
# copy of a video with bars and one without no longer line up.
#
# Measured over all 4560 pairs of the 96 video corpus, at -x 290 -m longest
# with the 40 per cent threshold below:
#
#              true duplicates found   false positives   separation
#   bars left        717 of 720               0            -10.3 points
#   bars cropped     720 of 720               0            +13.9 points
#
# The three pairs it recovers were all one source edited with bars among four
# other manipulations; the worst of them was reported at 30.6 per cent where
# the right answer is 100, and comes back at exactly 100 once the bars are
# gone. Negative separation means no threshold splits the classes cleanly, so
# this is the difference between a rule that works and one that only mostly
# works.
#
# Detection costs about a twentieth of fingerprinting, because it samples 72
# frames rather than decoding the file, and the crop then rides along in the
# same ffmpeg pipeline. No cropped copy of the video is written.
#
# It is right about whether a video has bars in 96 of 96, and about the exact
# height in 95 of 96, worst error one row. Where it cannot tell, a video too
# still for anything to move, it crops nothing. See tools/detect_bars.py.
crop_bars = true
# Optional colour detection for plain black bars on still footage. Never automatic.
# motion keeps the existing cache; black uses its own detector identity.
crop_mode = "motion"

# Let mpeg7dupes' coarse filter skip a pair of segments before the frame by
# frame walk, which it does when three of their five coarse words share a
# tenth or less.
#
# On by default. On the corpus the settings were tuned on it kept every true
# match and took about two thirds off the comparison time, 101 s against 280 s
# over 1128 pairs. That corpus is six textured sources, though, and footage so
# monotonous that a coarse word holds only a few bits is the material that
# could defeat it.
#
# The first independent validation set, six other sources with a sunset from a
# locked-off camera and a night sky among them, showed both sides. With the
# filter off, 7 of the 256 matches it should have made and had missed came
# back, all on the sunset and 5 of them lost to a bar-detector fault fixed
# since, in detector version 2; and 204 false ones appeared, clips of 10 and 20 s
# and an 8 s opening reported inside unrelated videos at 40 to 100 per cent.
# For this question the filter guards short sources as well as saving time,
# so off is not the safe side. See benchmark.md, Independent validation.
#
# false, or --no-coarse-filter, passes -d 10001, which turns the filter off,
# so a run can check what it costs on your material; the record says which way
# each run was made. Expect the comparison to take about three times as long.
# Fingerprinting costs the same either way.
coarse_filter = true

# Frame similarity threshold, passed to mpeg7dupes as -x.
#
# This matters more than it looks. Measured over 96 edited videos, raising it
# from 60 to 290 changed two whole families of edit:
#   black bars added        never detected  ->  always detected
#   black bars with text    never detected  ->  always detected
# and added no false positives. Below 290 they are missed entirely, not partly.
#
# 290 is also the last value before the same black bars start working against
# the comparison. The bars are 140 pixels top and bottom, so a fifth of every
# frame is identical black in any video carrying them, whatever it shows. That
# shared fifth is not enough to pass 290, and is enough to pass 310. Measured
# over 4560 pairs, the highest coverage reached by a pair of unrelated videos:
#
#   -x 290    20.9%    still below the 40% report threshold
#   -x 310    50.1%    above it; the twelve highest all had black bars
#   -x 330   100.0%    unrelated videos matching end to end
#
# So the ceiling changes hands between 290 and 310. Up to 290 it is set by
# pairs that really do share an advertisement, which is honest. From 310 it is
# set by black bars, which is not. Do not raise this past 290 without
# rerunning the sweep. See benchmark.md.
#
# 290 is loose for short sources, though: on the second validation set, frames
# that share only a layout, a dark sky over a lighter foreground, passed it
# often enough to put sources under about two minutes inside unrelated videos.
# A lower value removed those matches only by also losing reframed copies, so
# it stays. See min_coverage above.
thxh = 290

# Cores for the comparison. 0 leaves it to mpeg7dupes, which uses every one.
# Decoding is the slow part, so this makes little difference.
jobs = 0

# Which extensions count as video when walking the candidates folder.
extensions = ["mp4", "mkv", "avi", "mov", "wmv", "flv", "ts", "m4v", "webm", "mpg", "mpeg"]

# Paths to the three programs, needed only when they are not on PATH.
# mpeg7dupes can be the static build from the nightly release, which has no
# runtime dependencies at all.
ffmpeg = "ffmpeg"
ffprobe = "ffprobe"
mpeg7dupes = "mpeg7dupes"
