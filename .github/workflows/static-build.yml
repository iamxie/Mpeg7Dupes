name: Static build

# Builds the standalone binary and publishes it, in two situations:
#
#   nightly    once a day from master, published as nightly-<short sha> and
#              marked prerelease
#   release    when a v* tag is pushed, published under the tag name as a
#              real release
#
# Both take the same path: build for x86_64 and aarch64, check the binary is
# actually static, run the test suite, smoke test a clip from video all the way
# to a match, then publish. A release is a nightly that someone decided to
# stand behind, so it should not be built by a second, less exercised route.
#
# The guard skips the whole thing when a release with the name it would use
# already exists. It asks about the release rather than about how long ago a
# commit landed, so a missed or late run catches up instead of silently
# skipping, and a rerun never produces a second release for the same name.
#
# Injection: schedule and workflow_dispatch carry no attacker-controlled
# payload. A tag push carries the tag name, which only someone with write
# access can create, and which git already forbids from containing whitespace
# or control characters. Every expression here still reaches the shell through
# env and quoted expansion rather than by interpolation, tag name included,
# because that is the habit that stays correct when the trigger list grows.

on:
  schedule:
    - cron: '17 3 * * *'   # 03:17 UTC daily, off the hour to dodge scheduler congestion
  workflow_dispatch:       # and on demand
  push:
    tags:
      - 'v*'               # v0.1, v0.2, v1.0 ...

permissions:
  contents: write          # needed to publish the release

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
      tag: ${{ steps.check.outputs.tag }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7

      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            tag="$REF_NAME"
            prerelease=false
          else
            tag="nightly-$(git rev-parse --short HEAD)"
            prerelease=true
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then
            echo "$tag already exists, nothing new to build"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "building $tag"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: guard
    if: needs.guard.outputs.build == 'true'
    strategy:
      fail-fast: false     # one architecture failing should not take the other down
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          # arm64 runners are free for public repositories. If this leg cannot
          # find a runner, drop it and the x86_64 build still publishes.
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # libavcodec-dev and libavfilter-dev are here for headers only; the
          # binary references no symbol from either. ffmpeg is for the smoke test.
          sudo apt-get install -y --no-install-recommends \
            build-essential libavcodec-dev libavfilter-dev ffmpeg

      - name: Build and install slog
        run: |
          # The default branch, not a tag. The newest tag is v1.8.49 and its
          # header declares 1.9, while 1.6.2 keeps its Makefile in src/ so a
          # plain make there fails. See the README.
          git clone --depth 1 https://github.com/kala13x/slog /tmp/slog
          cd /tmp/slog
          echo "slog $(git rev-parse --short HEAD)"
          make
          sudo make install

      - name: Build
        run: make static -l"$(nproc)"

      - name: Verify it is actually standalone
        run: |
          file bin/mpeg7Dupes.elf
          # Require the message rather than rejecting anything unlike it, so a
          # stray warning line on stderr cannot fail an otherwise static build.
          if ! ldd bin/mpeg7Dupes.elf 2>&1 | grep -q 'not a dynamic executable'; then
            echo "::error::binary is not statically linked"
            ldd bin/mpeg7Dupes.elf
            exit 1
          fi

      # Fixtures are checked in, so this covers the comparison itself without
      # depending on how the runner's ffmpeg happens to encode.
      - name: Run the test suite
        run: make test

      # The suite compares signatures that were generated elsewhere, so this
      # still earns its place: it takes a clip all the way from video to match
      # on this machine, and would catch the signature format drifting.
      - name: Smoke test
        run: |
          set -e
          work="$(mktemp -d)"
          cd "$work"
          ffmpeg -v error -f lavfi -i 'mandelbrot=size=320x180:rate=25' -t 120 \
            -c:v libx264 -preset ultrafast -pix_fmt yuv420p a.mp4
          # b is a rescaled copy of a with five seconds cut from the head
          ffmpeg -v error -ss 5 -t 110 -i a.mp4 -vf scale=240:136 \
            -c:v libx264 -preset medium -crf 23 -pix_fmt yuv420p b.mp4
          for f in a b; do
            ffmpeg -v error -i "$f.mp4" -vf "fps=5,signature=filename=$f.bin" \
              -map 0:v:0 -an -f null -
          done
          out="$("$GITHUB_WORKSPACE/bin/mpeg7Dupes.elf" -f csv -m full -i 0 a.bin b.bin 2>/dev/null)"
          echo "$out"
          # Header plus exactly one row, and it has to be a whole match
          rows="$(echo "$out" | tail -n +2 | grep -c . || true)"
          whole="$(echo "$out" | tail -n +2 | head -1 | awk -F, '{print $NF}')"
          if [ "$rows" != "1" ] || [ "$whole" != "1" ]; then
            echo "::error::expected exactly one whole match, got $rows row(s), whole=$whole"
            exit 1
          fi

      - name: Stage the artefact
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          cp bin/mpeg7Dupes.elf "dist/mpeg7dupes-linux-$ARCH"
          cd dist
          sha256sum "mpeg7dupes-linux-$ARCH" > "mpeg7dupes-linux-$ARCH.sha256"
          ls -l

      - uses: actions/upload-artifact@v7
        with:
          name: mpeg7dupes-linux-${{ matrix.arch }}
          path: dist/*
          retention-days: 7

  release:
    needs: [guard, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # Ask the binary what it is rather than repeating what version.h is
      # believed to say, so the notes cannot claim a build the artefact is not.
      # The runner is x86_64; if that leg failed and only aarch64 published,
      # there is nothing runnable here and the notes omit the line.
      - id: version
        run: |
          reported=""
          bin=dist/mpeg7dupes-linux-x86_64
          if [ -f "$bin" ]; then
            chmod +x "$bin"
            reported="$("$bin" --version 2>/dev/null | head -1 || true)"
          fi
          echo "string=$reported" >> "$GITHUB_OUTPUT"
          echo "reported: ${reported:-<unavailable>}"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.guard.outputs.tag }}
          PRERELEASE: ${{ needs.guard.outputs.prerelease }}
          VERSION: ${{ steps.version.outputs.string }}
          SHA: ${{ github.sha }}
        run: |
          ls -l dist

          if [ "$PRERELEASE" = true ]; then
            cat > notes.md <<'EOF'
          Statically linked build of the current `master`, with no runtime
          dependencies. This is a nightly: it passed CI, but nobody has decided
          it is the version to use. For that, take the newest `v*` release.
          EOF
          else
            cat > notes.md <<'EOF'
          Statically linked release build, with no runtime dependencies.

          Download the binary for your architecture, `chmod +x` it, and run it.
          The `.sha256` beside each one is its checksum.

          **Settings.** Pass `-i 0`; any other value truncates the match. To
          find duplicates use `-x 290 -m longest`, then keep the pairs whose
          match covers at least 40 per cent of the shorter file. Measured over
          4560 pairs built from 96 edited videos, that finds 717 of 720 true
          duplicates with no false positives; `benchmark.md` has the corpus,
          the method and the limits. `tools/find_reuse.py` applies all of it.
          EOF
          fi

          cat >> notes.md <<'EOF'

          CI checks the binary reports `not a dynamic executable`, runs the test
          suite, and smoke tests it against a rescaled and trimmed duplicate it
          has to find.

          Built without `-march=native`, so it runs on any CPU of the matching
          architecture. `make release` gives a faster binary if you are staying
          on one machine.
          EOF

          if [ -n "$VERSION" ]; then
            printf '\nReports: `%s`\n' "$VERSION" >> notes.md
          fi
          printf '\nCommit: %s\n' "$SHA" >> notes.md

          if [ "$PRERELEASE" = true ]; then
            gh release create "$TAG" dist/* --repo "$REPO" \
              --title "$TAG" --notes-file notes.md --prerelease
          else
            gh release create "$TAG" dist/* --repo "$REPO" \
              --title "$TAG" --notes-file notes.md
          fi
